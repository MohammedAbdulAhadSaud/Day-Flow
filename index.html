<body>
<div id="root"></div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((err) => {
        console.warn('Service worker registration failed:', err);
      });

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect } = React;

// ---------- storage keys ----------
const LS_CATEGORIES = "dayflow_categories_v1";
const LS_COMPLETIONS = "dayflow_completions_v1";
const LS_SETTINGS = "dayflow_settings_v1";

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return fallback;
}
function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

// ---------- date helpers ----------
const pad = (n) => String(n).padStart(2, "0");
const keyOf = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WEEKDAYS = ["M","T","W","T","F","S","S"];
const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
function firstDowOffset(y, m) { const jsDow = new Date(y, m, 1).getDay(); return (jsDow + 6) % 7; }
function fmtDate(y, m, d) { return `${DOW[new Date(y, m, d).getDay()]}, ${MONTHS[m]} ${d}`; }
function uid(name) { return name.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-") + "-" + Date.now() + Math.floor(Math.random()*1000); }

const Icon = ({ name, size = 18, color = "currentColor" }) => {
  const p = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" };
  switch (name) {
    case "sliders": return <svg {...p}><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>;
    case "chevronLeft": return <svg {...p}><polyline points="15 18 9 12 15 6"/></svg>;
    case "chevronRight": return <svg {...p}><polyline points="9 18 15 12 9 6"/></svg>;
    case "check": return <svg {...p} fill={color}><circle cx="12" cy="12" r="10" fill={color}/><path d="M9 12l2 2 4-4" stroke="#151420" fill="none"/></svg>;
    case "trending": return <svg {...p}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>;
    case "settings": return <svg {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
    case "dumbbell": return <svg {...p}><path d="M6.5 6.5 17.5 17.5"/><path d="M21 21l-1-1"/><path d="M4 4l1 1"/><path d="M18 6l2 2-2 2-2-2z"/><path d="M4 16l2 2 2-2-2-2z"/><path d="M20 4l1 1"/><path d="M3 20l1 1"/></svg>;
    case "book": return <svg {...p}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>;
    case "heart": return <svg {...p}><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>;
    case "user": return <svg {...p}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
    case "briefcase": return <svg {...p}><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>;
    case "plus": return <svg {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    case "trash": return <svg {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>;
    case "bell": return <svg {...p}><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>;
    case "sparkles": return <svg {...p}><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/></svg>;
    case "flame": return <svg {...p} fill={color} stroke="none"><path d="M12 2c1 3-1 4-2 6-1.5 3 0 6 3 6 2 0 4-1.5 4-4 0-2-1-3-1-3s2 1 2 5c0 4-3 7-7 7s-7-3-7-7c0-5 4-7 5-10 .3 2 1 3 1 3-.5-1 1-2 2-3z"/></svg>;
    case "trophy": return <svg {...p}><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3a2 2 0 0 1-2 5M7 5H4a2 2 0 0 0 2 5"/></svg>;
    case "star": return <svg {...p} fill={color} stroke="none"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"/></svg>;
    case "x": return <svg {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
    case "calendar": return <svg {...p}><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
    case "pencil": return <svg {...p}><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>;
    default: return null;
  }
};

const ICON_MAP = { Dumbbell: "dumbbell", BookOpen: "book", Heart: "heart", User: "user", Briefcase: "briefcase" };

const DEFAULT_CATEGORIES = [
  { id: "exercise", name: "Exercise", icon: "Dumbbell", subtasks: [
    { id: "legs", name: "Legs" }, { id: "arms", name: "Arms" },
    { id: "chest", name: "Chest" }, { id: "core", name: "Core" },
  ]},
  { id: "study", name: "Study", icon: "BookOpen", subtasks: [
    { id: "math", name: "Mathematics" }, { id: "reading", name: "Reading" },
  ]},
  { id: "health", name: "Health", icon: "Heart", subtasks: [
    { id: "water", name: "Drink water" },
  ]},
  { id: "personal", name: "Personal", icon: "User", subtasks: [
    { id: "meditation", name: "Meditation" },
  ]},
];

function seedHistory(categories, today) {
  const allSubtaskIds = categories.flatMap((c) => c.subtasks.map((s) => s.id));
  const completions = {};
  if (allSubtaskIds.length === 0) return completions;
  for (let offset = 6; offset >= 1; offset--) {
    const d = new Date(today);
    d.setDate(d.getDate() - offset);
    const k = keyOf(d.getFullYear(), d.getMonth(), d.getDate());
    const doneCount = Math.min(allSubtaskIds.length, 2 + Math.floor(Math.random() * allSubtaskIds.length));
    const shuffled = [...allSubtaskIds].sort(() => Math.random() - 0.5);
    const doneMap = {};
    shuffled.slice(0, doneCount).forEach((id) => (doneMap[id] = true));
    completions[k] = doneMap;
  }
  return completions;
}

function DayFlow() {
  const today = useMemo(() => new Date(), []);
  const [tab, setTab] = useState("calendar");

  const [categories, setCategories] = useState(() => loadJSON(LS_CATEGORIES, DEFAULT_CATEGORIES));
  const [completions, setCompletions] = useState(() => {
    const saved = loadJSON(LS_COMPLETIONS, null);
    if (saved) return saved;
    const cats = loadJSON(LS_CATEGORIES, DEFAULT_CATEGORIES);
    return seedHistory(cats, today);
  });
  const savedSettings = loadJSON(LS_SETTINGS, { reminders: true, dark: true });
  const [remindersOn, setRemindersOn] = useState(savedSettings.reminders);
  const [darkOn, setDarkOn] = useState(savedSettings.dark);

  const [viewYear, setViewYear] = useState(today.getFullYear());
  const [viewMonth, setViewMonth] = useState(today.getMonth());
  const [selectedDate, setSelectedDate] = useState({ y: today.getFullYear(), m: today.getMonth(), d: today.getDate() });

  const [showNewCategory, setShowNewCategory] = useState(false);
  const [newCategoryName, setNewCategoryName] = useState("");

  const [showAddTask, setShowAddTask] = useState(false);
  const [addTaskCategoryId, setAddTaskCategoryId] = useState(categories[0]?.id || "");
  const [addTaskName, setAddTaskName] = useState("");
  const [addTaskNewCategory, setAddTaskNewCategory] = useState(categories.length === 0);
  const [addTaskNewCategoryName, setAddTaskNewCategoryName] = useState("");

  const [toast, setToast] = useState(null);
  function showToast(msg) { setToast(msg); setTimeout(() => setToast((t) => (t === msg ? null : t)), 1800); }

  // ---------- persistence ----------
  useEffect(() => { saveJSON(LS_CATEGORIES, categories); }, [categories]);
  useEffect(() => { saveJSON(LS_COMPLETIONS, completions); }, [completions]);
  useEffect(() => { saveJSON(LS_SETTINGS, { reminders: remindersOn, dark: darkOn }); }, [remindersOn, darkOn]);

  const allSubtasks = useMemo(() => categories.flatMap((c) => c.subtasks.map((s) => ({ ...s, categoryId: c.id }))), [categories]);
  const totalCount = allSubtasks.length;
  const selectedKey = keyOf(selectedDate.y, selectedDate.m, selectedDate.d);
  const todayKey = keyOf(today.getFullYear(), today.getMonth(), today.getDate());
  const doneForKey = (k) => { const map = completions[k] || {}; return allSubtasks.filter((s) => map[s.id]).length; };
  const selectedDone = doneForKey(selectedKey);
  const selectedPct = totalCount ? Math.round((selectedDone / totalCount) * 100) : 0;

  function toggleSubtask(subtaskId, k = selectedKey) {
    setCompletions((prev) => { const map = { ...(prev[k] || {}) }; map[subtaskId] = !map[subtaskId]; return { ...prev, [k]: map }; });
  }

  function addCategory(name) {
    if (!name.trim()) return null;
    const id = uid(name);
    setCategories((prev) => [...prev, { id, name: name.trim(), icon: "Briefcase", subtasks: [] }]);
    setNewCategoryName(""); setShowNewCategory(false);
    showToast(`Added "${name.trim()}" category`);
    return id;
  }

  function deleteCategory(categoryId, categoryName) {
    if (!window.confirm(`Delete "${categoryName}" and all its tasks? This can't be undone.`)) return;
    setCategories((prev) => prev.filter((c) => c.id !== categoryId));
    showToast(`Deleted "${categoryName}"`);
  }

  function renameCategory(categoryId, currentName) {
    const name = window.prompt("Rename category", currentName);
    if (name && name.trim() && name.trim() !== currentName) {
      setCategories((prev) => prev.map((c) => (c.id === categoryId ? { ...c, name: name.trim() } : c)));
      showToast("Category renamed");
    }
  }

  function removeSubtask(categoryId, subtaskId, subtaskName) {
    if (!window.confirm(`Delete "${subtaskName}"?`)) return;
    setCategories((prev) => prev.map((c) => (c.id === categoryId ? { ...c, subtasks: c.subtasks.filter((s) => s.id !== subtaskId) } : c)));
    showToast("Task deleted");
  }

  function openAddTask() {
    setAddTaskCategoryId(categories[0]?.id || "");
    setAddTaskNewCategory(categories.length === 0);
    setAddTaskNewCategoryName("");
    setAddTaskName("");
    setShowAddTask(true);
  }

  function submitAddTask() {
    const taskName = addTaskName.trim();
    if (!taskName) return;
    let categoryId = addTaskCategoryId;
    if (addTaskNewCategory) {
      const catName = addTaskNewCategoryName.trim();
      if (!catName) return;
      categoryId = uid(catName);
      setCategories((prev) => [...prev, { id: categoryId, name: catName, icon: "Briefcase", subtasks: [{ id: uid(taskName), name: taskName }] }]);
    } else {
      if (!categoryId) return;
      setCategories((prev) => prev.map((c) => (c.id === categoryId ? { ...c, subtasks: [...c.subtasks, { id: uid(taskName), name: taskName }] } : c)));
    }
    showToast(`Added "${taskName}"`);
    setShowAddTask(false);
  }

  const last7 = useMemo(() => {
    const arr = [];
    for (let offset = 6; offset >= 0; offset--) {
      const d = new Date(today); d.setDate(d.getDate() - offset);
      const k = keyOf(d.getFullYear(), d.getMonth(), d.getDate());
      const done = k === todayKey ? doneForKey(todayKey) : doneForKey(k);
      arr.push({ label: DOW[d.getDay()].slice(0, 2), done, k, isToday: k === todayKey });
    }
    return arr;
  }, [completions, categories, today, todayKey]);

  const weekTotal = last7.reduce((a, b) => a + b.done, 0);
  const weekPossible = totalCount * 7;
  const bestDay = useMemo(() => { let best = last7[0]; for (const d of last7) if (d.done > best.done) best = d; return best; }, [last7]);

  const streaks = useMemo(() => {
    let current = 0; let d = new Date(today);
    while (true) {
      const k = keyOf(d.getFullYear(), d.getMonth(), d.getDate());
      const done = doneForKey(k);
      if (done === totalCount && totalCount > 0) { current++; d.setDate(d.getDate() - 1); } else break;
    }
    return { current, longest: Math.max(current, 0) };
  }, [completions, categories]);

  // ---------- shared UI ----------
  const Header = () => (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", padding: "20px 20px 0" }}>
      <div>
        <h1 style={{ margin: 0, fontSize: 30, fontWeight: 800, color: "#f5f3ff", letterSpacing: -0.5 }}>DayFlow</h1>
        <p style={{ margin: "2px 0 0", fontSize: 14, color: "#8b8896" }}>A clearer rhythm for your day</p>
      </div>
      <button onClick={() => setTab("settings")} style={{ width: 48, height: 48, borderRadius: "50%", border: "none", background: "linear-gradient(135deg,#7c3aed,#5b21b6)", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", boxShadow: "0 4px 14px rgba(124,58,237,0.4)" }}>
        <Icon name="sliders" size={20} color="#f5f3ff" />
      </button>
    </div>
  );
  const Card = ({ children, style }) => <div style={{ background: "#151420", borderRadius: 22, padding: 20, border: "1px solid #232132", ...style }}>{children}</div>;
  const navBtnStyle = { width: 34, height: 34, borderRadius: "50%", border: "none", background: "#232132", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" };
  function ProgressBar({ value, style }) {
    return <div style={{ height: 8, borderRadius: 8, background: "#232132", overflow: "hidden", ...style }}>
      <div style={{ height: "100%", width: `${Math.min(100, value * 100)}%`, background: "linear-gradient(90deg,#a78bfa,#c4b5fd)", borderRadius: 8, transition: "width .3s" }} />
    </div>;
  }
  const AddTaskButton = ({ label = "Add task" }) => (
    <button onClick={openAddTask} style={{ padding: "16px 0", borderRadius: 18, border: "none", background: "#c4b5fd", color: "#2e1065", fontSize: 16, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", gap: 8, cursor: "pointer" }}>
      <Icon name="plus" size={18} /> {label}
    </button>
  );

  function CategoryCard({ category, dateKey, editable }) {
    const iconName = ICON_MAP[category.icon] || "briefcase";
    const map = completions[dateKey] || {};
    const done = category.subtasks.filter((s) => map[s.id]).length;
    return (
      <Card>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{ width: 40, height: 40, borderRadius: 12, background: "#7c3aed", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
            <Icon name={iconName} size={19} color="#f5f3ff" />
          </div>
          <div style={{ fontSize: 17, fontWeight: 700, color: "#f5f3ff", flex: 1 }}>{category.name}</div>
          <div style={{ fontSize: 14, color: "#8b8896" }}>{done}/{category.subtasks.length}</div>
        </div>
        <div style={{ marginTop: 6 }}>
          {category.subtasks.map((s) => {
            const checked = !!map[s.id];
            return (
              <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "13px 0", borderTop: "1px solid #232132" }}>
                <div onClick={() => toggleSubtask(s.id, dateKey)} style={{ width: 22, height: 22, borderRadius: 7, cursor: "pointer", border: checked ? "none" : "2px solid #4b4860", background: checked ? "#7c3aed" : "transparent", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                  {checked && <Icon name="check" size={16} color="#7c3aed" />}
                </div>
                <div style={{ fontSize: 16, color: checked ? "#8b8896" : "#e7e5ef", flex: 1, textDecoration: checked ? "line-through" : "none" }}>{s.name}</div>
                {editable && (
                  <button onClick={() => removeSubtask(category.id, s.id, s.name)} style={{ background: "none", border: "none", cursor: "pointer", padding: 4, color: "#8b6b6b" }} title="Delete task">
                    <Icon name="trash" size={16} />
                  </button>
                )}
              </div>
            );
          })}
          {category.subtasks.length === 0 && <div style={{ padding: "10px 0", color: "#6b6878", fontSize: 14 }}>No tasks in this category yet.</div>}
        </div>
      </Card>
    );
  }

  // ---------- CALENDAR ----------
  function CalendarTab() {
    const dim = daysInMonth(viewYear, viewMonth);
    const offset = firstDowOffset(viewYear, viewMonth);
    const cells = []; for (let i = 0; i < offset; i++) cells.push(null); for (let d = 1; d <= dim; d++) cells.push(d);
    function changeMonth(delta) { let m = viewMonth + delta, y = viewYear; if (m < 0) { m = 11; y -= 1; } if (m > 11) { m = 0; y += 1; } setViewMonth(m); setViewYear(y); }
    return (
      <div style={{ padding: "18px 20px 100px", display: "flex", flexDirection: "column", gap: 18 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end" }}>
          <div>
            <div style={{ fontSize: 12, letterSpacing: 1.5, color: "#8b8896", fontWeight: 600 }}>SELECTED DATE</div>
            <div style={{ fontSize: 24, fontWeight: 800, color: "#f5f3ff", marginTop: 4 }}>{fmtDate(selectedDate.y, selectedDate.m, selectedDate.d)}</div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: 26, fontWeight: 800, color: "#c4b5fd" }}>{selectedPct}%</div>
            <div style={{ fontSize: 13, color: "#8b8896" }}>complete</div>
          </div>
        </div>
        <Card>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ fontSize: 12, letterSpacing: 1.5, color: "#8b8896", fontWeight: 600 }}>MONTHLY OVERVIEW</div>
              <div style={{ fontSize: 21, fontWeight: 800, color: "#f5f3ff", marginTop: 4 }}>{MONTHS[viewMonth]} {viewYear}</div>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => changeMonth(-1)} style={navBtnStyle}><Icon name="chevronLeft" size={18} color="#d8d5e6" /></button>
              <button onClick={() => changeMonth(1)} style={navBtnStyle}><Icon name="chevronRight" size={18} color="#d8d5e6" /></button>
            </div>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", marginTop: 18, rowGap: 14 }}>
            {WEEKDAYS.map((w, i) => <div key={i} style={{ textAlign: "center", fontSize: 13, color: "#6b6878", fontWeight: 600 }}>{w}</div>)}
            {cells.map((d, i) => {
              if (!d) return <div key={i} />;
              const k = keyOf(viewYear, viewMonth, d);
              const isSelected = selectedDate.y === viewYear && selectedDate.m === viewMonth && selectedDate.d === d;

              const done = doneForKey(k);
              let dotColor = "#3b82f6";
              if (done === totalCount && totalCount > 0) dotColor = "#22c55e";
              if (isPast && done === 0 && totalCount > 0) dotColor = "#f97316";
              return (
                <div key={i} onClick={() => setSelectedDate({ y: viewYear, m: viewMonth, d })} style={{ textAlign: "center", cursor: "pointer", padding: "6px 0", borderRadius: 14, background: isSelected ? "#c4b5fd" : "transparent" }}>

  function SettingsTab() {
    function exportData() {
      const data = { categories, completions, exportedAt: new Date().toISOString() };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "dayflow-backup.json"; a.click();
      URL.revokeObjectURL(url);
      showToast("Backup downloaded");
    }
    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (data.categories) setCategories(data.categories);
          if (data.completions) setCompletions(data.completions);
          showToast("Backup restored");
        } catch (err) { showToast("Couldn't read that file"); }
      };
      reader.readAsText(file);
      e.target.value = "";
    }
    function resetAll() {
      if (!window.confirm("Erase all tasks and history and start fresh? This can't be undone.")) return;
      setCategories(DEFAULT_CATEGORIES);
      setCompletions(seedHistory(DEFAULT_CATEGORIES, today));
      showToast("Reset to defaults");
    }
    return (
      <div style={{ padding: "18px 20px 100px", display: "flex", flexDirection: "column", gap: 16 }}>
        <div>
          <div style={{ fontSize: 12, letterSpacing: 1.5, color: "#8b8896", fontWeight: 600 }}>PREFERENCES</div>
          <div style={{ fontSize: 26, fontWeight: 800, color: "#f5f3ff", marginTop: 4 }}>Settings</div>
          <p style={{ fontSize: 14, color: "#8b8896", marginTop: 6 }}>DayFlow keeps your routines on this device.</p>
        </div>
        <Card>
          <Row iconName="bell" title="Reminders" subtitle="Optional task notifications" right={<Toggle on={remindersOn} onClick={() => setRemindersOn((v) => !v)} />} />
          <Divider />
          <Row iconName="sparkles" title="Dark appearance" subtitle="Material You dark surface" right={<Toggle on={darkOn} onClick={() => setDarkOn((v) => !v)} />} />
          <Divider />
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "14px 0 4px" }}>
            <div style={{ fontSize: 17, fontWeight: 700, color: "#f5f3ff" }}>Categories</div>
            <button onClick={() => setShowNewCategory(true)} style={{ background: "none", border: "none", color: "#c4b5fd", fontSize: 15, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", gap: 4 }}><Icon name="plus" size={16} /> Add</button>
          </div>
          {categories.length === 0 && <div style={{ color: "#6b6878", fontSize: 14, padding: "8px 0" }}>No categories yet.</div>}
          {categories.map((c) => {
            const iconName = ICON_MAP[c.icon] || "briefcase";
            return (
              <div key={c.id}>
                <Divider />
                <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "13px 0" }}>
                  <Icon name={iconName} size={18} color="#d8d5e6" />
                  <div style={{ fontSize: 16, color: "#f5f3ff", flex: 1, fontWeight: 600 }}>{c.name}</div>
                  <div style={{ fontSize: 14, color: "#8b8896" }}>{c.subtasks.length} tasks</div>
                  <button onClick={() => renameCategory(c.id, c.name)} style={{ background: "none", border: "none", color: "#8b8896", cursor: "pointer", padding: 4 }} title="Rename"><Icon name="pencil" size={16} /></button>
                  <button onClick={() => deleteCategory(c.id, c.name)} style={{ background: "none", border: "none", color: "#8b6b6b", cursor: "pointer", padding: 4 }} title="Delete category"><Icon name="trash" size={16} /></button>
                </div>
              </div>
            );
          })}
        </Card>
        <Card>
          <div style={{ fontSize: 17, fontWeight: 700, color: "#f5f3ff" }}>Data</div>
          <p style={{ fontSize: 14, color: "#8b8896", marginTop: 6, lineHeight: 1.5 }}>Everything is saved on this device automatically. Back up or restore anytime.</p>
          <button onClick={exportData} style={{ marginTop: 12, width: "100%", padding: "12px 0", borderRadius: 14, cursor: "pointer", border: "1px solid #3a3750", background: "transparent", color: "#e7e5ef", fontSize: 15, fontWeight: 600 }}>Download backup</button>
          <label style={{ display: "block", marginTop: 10, width: "100%", padding: "12px 0", borderRadius: 14, cursor: "pointer", border: "1px solid #3a3750", background: "transparent", color: "#e7e5ef", fontSize: 15, fontWeight: 600, textAlign: "center" }}>
            Restore from backup
            <input type="file" accept="application/json" onChange={importData} style={{ display: "none" }} />
          </label>
          <button onClick={resetAll} style={{ marginTop: 10, width: "100%", padding: "12px 0", borderRadius: 14, cursor: "pointer", border: "1px solid #4a2020", background: "transparent", color: "#e0a0a0", fontSize: 15, fontWeight: 600 }}>Erase everything &amp; reset</button>
        </Card>

        {showNewCategory && (
          <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 50 }} onClick={() => setShowNewCategory(false)}>
            <div onClick={(e) => e.stopPropagation()} style={{ width: "100%", maxWidth: 480, background: "#17151f", borderRadius: "24px 24px 0 0", padding: 24, borderTop: "1px solid #2a2740" }}>
              <div style={{ width: 40, height: 4, borderRadius: 4, background: "#3a3750", margin: "0 auto 18px" }} />
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>

              <button onClick={() => addCategory(newCategoryName)} disabled={!newCategoryName.trim()} style={{ width: "100%", marginTop: 16, padding: "16px 0", borderRadius: 16, border: "none", background: newCategoryName.trim() ? "#c4b5fd" : "#3a3750", color: newCategoryName.trim() ? "#2e1065" : "#8b8896", fontSize: 16, fontWeight: 700, cursor: newCategoryName.trim() ? "pointer" : "default" }}>Create category</button>
            </div>
          </div>
        )}
      </div>
    );
  }

            {!addTaskNewCategory && categories.length > 0 ? (
              <select value={addTaskCategoryId} onChange={(e) => setAddTaskCategoryId(e.target.value)}
                style={{ width: "100%", padding: "14px 16px", borderRadius: 14, border: "1px solid #2a2740", background: "#100e18", color: "#f5f3ff", fontSize: 16, outline: "none" }}>
                {categories.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            ) : (
              <input autoFocus value={addTaskNewCategoryName} onChange={(e) => setAddTaskNewCategoryName(e.target.value)} placeholder="e.g. Work"
                style={{ width: "100%", padding: "14px 16px", borderRadius: 14, border: "1px solid #2a2740", background: "#100e18", color: "#f5f3ff", fontSize: 16, outline: "none", boxSizing: "border-box" }} />
            )}
            {categories.length > 0 && (
              <button onClick={() => setAddTaskNewCategory((v) => !v)} style={{ background: "none", border: "none", color: "#c4b5fd", fontSize: 14, fontWeight: 600, cursor: "pointer", marginTop: 8, padding: 0 }}>
                {addTaskNewCategory ? "Choose an existing category instead" : "+ Use a new category instead"}
              </button>
            )}
          </div>

          <div style={{ marginTop: 16 }}>
            <div style={{ fontSize: 13, color: "#8b8896", fontWeight: 600, marginBottom: 8 }}>Task name</div>
            <input value={addTaskName} onChange={(e) => setAddTaskName(e.target.value)} placeholder="e.g. Yoga"
              onKeyDown={(e) => e.key === "Enter" && canSubmit && submitAddTask()}
              style={{ width: "100%", padding: "14px 16px", borderRadius: 14, border: "1px solid #2a2740", background: "#100e18", color: "#f5f3ff", fontSize: 16, outline: "none", boxSizing: "border-box" }} />
          </div>

          <button onClick={submitAddTask} disabled={!canSubmit} style={{ width: "100%", marginTop: 18, padding: "16px 0", borderRadius: 16, border: "none", background: canSubmit ? "#c4b5fd" : "#3a3750", color: canSubmit ? "#2e1065" : "#8b8896", fontSize: 16, fontWeight: 700, cursor: canSubmit ? "pointer" : "default" }}>Add task</button>
        </div>
      </div>
    );
  }

  function NavItem({ id, label, iconName }) {
    const active = tab === id;
    return (
      <button onClick={() => setTab(id)} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4, background: "none", border: "none", cursor: "pointer", padding: "10px 0" }}>
        <div style={{ width: 52, height: 30, borderRadius: 12, display: "flex", alignItems: "center", justifyContent: "center", background: active ? "#7c3aed" : "transparent" }}>
          <Icon name={iconName} size={18} color={active ? "#f5f3ff" : "#8b8896"} />
        </div>
        <span style={{ fontSize: 11, fontWeight: active ? 700 : 500, color: active ? "#f5f3ff" : "#8b8896" }}>{label}</span>
      </button>
    );
  }

  return (
    <div className="app-shell" style={{ width: "100%", background: "#0a0910", display: "flex", flexDirection: "column", position: "relative", overflow: "hidden" }}>
      <div style={{ flex: 1, overflowY: "auto" }}>
        <Header />
        {tab === "calendar" && <CalendarTab />}
        {tab === "tasks" && <TasksTab />}
        {tab === "insights" && <InsightsTab />}
        {tab === "settings" && <SettingsTab />}
      </div>
      <div className="bottom-nav" style={{ display: "flex", borderTop: "1px solid #1c1a28", background: "#0d0c14", paddingBottom: "env(safe-area-inset-bottom, 6px)" }}>
        <NavItem id="calendar" label="Calendar" iconName="calendar" />
        <NavItem id="tasks" label="Tasks" iconName="check" />
        <NavItem id="insights" label="Insights" iconName="trending" />
        <NavItem id="settings" label="Settings" iconName="settings" />
      </div>
      <AddTaskModal />
      {toast && (
        <div style={{ position: "fixed", bottom: 90, left: "50%", transform: "translateX(-50%)", background: "#232132", color: "#f5f3ff", padding: "10px 18px", borderRadius: 12, fontSize: 14, fontWeight: 600, boxShadow: "0 6px 20px rgba(0,0,0,0.4)", zIndex: 60 }}>
          {toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<DayFlow />);
</script>
</body>
</html>
