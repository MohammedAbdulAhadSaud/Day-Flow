<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>DayFlow</title>
<meta name="mobile-web-app-capable" content="yes" />

<body>
<div id="root"></div>

<script>

    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((err) => {

      });

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect } = React;

// ================= storage =================
const LS_CATEGORIES = "dayflow_categories_v1";
const LS_COMPLETIONS = "dayflow_completions_v1";
const LS_SETTINGS = "dayflow_settings_v1";
const LS_MIGRATION_CLEAN_SEED = "dayflow_migration_clean_seed_v1";
function loadJSON(key, fallback) {
  try { const raw = localStorage.getItem(key); if (raw) return JSON.parse(raw); } catch (e) {}
  return fallback;
}
function saveJSON(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }

// ================= date helpers =================
const pad = (n) => String(n).padStart(2, "0");
const keyOf = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WEEKDAYS = ["M","T","W","T","F","S","S"];
const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
function firstDowOffset(y, m) { const jsDow = new Date(y, m, 1).getDay(); return (jsDow + 6) % 7; }
function fmtDate(y, m, d) { return `${DOW[new Date(y, m, d).getDay()]}, ${MONTHS[m]} ${d}`; }
function uid(name) { return name.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-") + "-" + Date.now() + Math.floor(Math.random() * 1000); }

// ================= icon set =================
const Icon = ({ name, size = 18, color = "currentColor" }) => {
  const p = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" };
  switch (name) {
    case "sliders": return <svg {...p}><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>;
    case "chevronLeft": return <svg {...p}><polyline points="15 18 9 12 15 6"/></svg>;
    case "chevronRight": return <svg {...p}><polyline points="9 18 15 12 9 6"/></svg>;
    case "check": return <svg {...p} fill={color}><circle cx="12" cy="12" r="10" fill={color}/><path d="M9 12l2 2 4-4" stroke="#151420" fill="none"/></svg>;
    case "trending": return <svg {...p}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>;
    case "settings": return <svg {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
    case "dumbbell": return <svg {...p}><path d="M6.5 6.5 17.5 17.5"/><path d="M21 21l-1-1"/><path d="M4 4l1 1"/><path d="M18 6l2 2-2 2-2-2z"/><path d="M4 16l2 2 2-2-2-2z"/><path d="M20 4l1 1"/><path d="M3 20l1 1"/></svg>;
    case "book": return <svg {...p}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>;
    case "heart": return <svg {...p}><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>;
    case "user": return <svg {...p}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
    case "briefcase": return <svg {...p}><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>;
    case "plus": return <svg {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    case "trash": return <svg {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>;
    case "bell": return <svg {...p}><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>;
    case "sparkles": return <svg {...p}><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/></svg>;
    case "flame": return <svg {...p} fill={color} stroke="none"><path d="M12 2c1 3-1 4-2 6-1.5 3 0 6 3 6 2 0 4-1.5 4-4 0-2-1-3-1-3s2 1 2 5c0 4-3 7-7 7s-7-3-7-7c0-5 4-7 5-10 .3 2 1 3 1 3-.5-1 1-2 2-3z"/></svg>;
    case "trophy": return <svg {...p}><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3a2 2 0 0 1-2 5M7 5H4a2 2 0 0 0 2 5"/></svg>;
    case "star": return <svg {...p} fill={color} stroke="none"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"/></svg>;
    case "x": return <svg {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
    case "calendar": return <svg {...p}><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
    case "pencil": return <svg {...p}><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>;
    case "lock": return <svg {...p}><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
    case "dot": return <svg {...p} fill={color} stroke="none"><circle cx="12" cy="12" r="6"/></svg>;
    case "pin": return <svg {...p}><path d="M12 17v5"/><path d="M9 3h6l1 6 3 3v2H5v-2l3-3Z"/></svg>;
    default: return null;
  }
};
const ICON_MAP = { Dumbbell: "dumbbell", BookOpen: "book", Heart: "heart", User: "user", Briefcase: "briefcase", Dot: "dot" };
const navBtnStyle = { width: 34, height: 34, borderRadius: "50%", border: "none", background: "#232132", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" };

// ================= data helpers =================
const DEFAULT_CATEGORIES = [
  { id: "exercise", name: "Exercise", icon: "Dumbbell", allowEdit: true, subtasks: [
    { id: "legs", name: "Legs" }, { id: "arms", name: "Arms" },
    { id: "chest", name: "Chest" }, { id: "core", name: "Core" },
  ]},
  { id: "study", name: "Study", icon: "BookOpen", allowEdit: true, subtasks: [
    { id: "math", name: "Mathematics" }, { id: "reading", name: "Reading" },
  ]},
  { id: "health", name: "Health", icon: "Heart", allowEdit: true, subtasks: [
    { id: "water", name: "Drink water" },
  ]},
  { id: "personal", name: "Personal", icon: "User", allowEdit: true, subtasks: [
    { id: "meditation", name: "Meditation" },
  ]},
];
function categoryAllowsEdit(category) { return category && category.allowEdit !== false; }
function taskAllowsEdit(subtask) { return !!subtask && subtask.allowEdit !== false; }
// A task counts toward a given day's totals if it wasn't deleted, or was deleted on/after that day
// (deletion only removes a task from *future* days, past history keeps it).
function isTaskActiveOnDate(subtask, dateKey) { return !subtask.deletedAt || dateKey < subtask.deletedAt; }
function activeSubtaskIdsForDate(categories, dateKey, categoryFilterId) {
  const ids = [];
  categories.forEach((c) => {
    if (categoryFilterId && categoryFilterId !== "all" && c.id !== categoryFilterId) return;
    c.subtasks.forEach((s) => { if (isTaskActiveOnDate(s, dateKey)) ids.push(s.id); });
  });
  return ids;
}
function computeRhythm(categories, completions, today, todayKey, categoryFilterId) {
  const arr = [];
  for (let offset = 6; offset >= 0; offset--) {
    const d = new Date(today); d.setDate(d.getDate() - offset);
    const k = keyOf(d.getFullYear(), d.getMonth(), d.getDate());
    const ids = activeSubtaskIdsForDate(categories, k, categoryFilterId);
    const map = completions[k] || {};
    const done = ids.filter((id) => map[id]).length;
    arr.push({ label: DOW[d.getDay()].slice(0, 2), k, done, total: ids.length, isToday: k === todayKey });
  }
  return arr;
}
function computeStreak(categories, completions, today, categoryFilterId) {
  let current = 0; let d = new Date(today);
  while (true) {
    const k = keyOf(d.getFullYear(), d.getMonth(), d.getDate());
    const ids = activeSubtaskIdsForDate(categories, k, categoryFilterId);
    const map = completions[k] || {};
    const done = ids.filter((id) => map[id]).length;
    if (ids.length > 0 && done === ids.length) { current++; d.setDate(d.getDate() - 1); } else break;
  }
  return { current, longest: Math.max(current, 0) };
}
// ================= small presentational components (stable, top-level) =================
function Card({ children, style }) {
  return <div style={{ background: "#151420", borderRadius: 22, padding: 20, border: "1px solid #232132", ...style }}>{children}</div>;
}
function ProgressBar({ value, style }) {
  return (
    <div style={{ height: 8, borderRadius: 8, background: "#232132", overflow: "hidden", ...style }}>
      <div style={{ height: "100%", width: `${Math.min(100, value * 100)}%`, background: "linear-gradient(90deg,#a78bfa,#c4b5fd)", borderRadius: 8, transition: "width .3s" }} />
    </div>
  );
}
function Divider() { return <div style={{ height: 1, background: "#232132", margin: "10px 0" }} />; }
function AllowEditField({ checked, onChange, title = "Allow editing past days", description = "Lets you check off tasks in this category for previous dates from Insights — handy for logging things you forgot to mark. Turn off to keep past records locked." }) {
  return (
    <label style={{ display: "flex", alignItems: "flex-start", gap: 10, marginTop: 16, cursor: "pointer" }}>
      <input type="checkbox" checked={checked} onChange={(e) => onChange(e.target.checked)}
        style={{ width: 18, height: 18, marginTop: 2, accentColor: "#7c3aed", flexShrink: 0 }} />
      <span>
        <span style={{ fontSize: 15, fontWeight: 700, color: "#f5f3ff", display: "block" }}>{title}</span>
        <span style={{ fontSize: 13, color: "#8b8896", lineHeight: 1.4 }}>{description}</span>
      </span>
    </label>
  );
}
function StatBox({ iconName, iconColor, value, label }) {
  return (
    <Card style={{ textAlign: "center", padding: "18px 8px" }}>
      <div style={{ display: "flex", justifyContent: "center" }}><Icon name={iconName} size={20} color={iconColor} /></div>
      <div style={{ fontSize: 20, fontWeight: 800, color: "#f5f3ff", marginTop: 8 }}>{value}</div>
      <div style={{ fontSize: 12, color: "#8b8896", marginTop: 2 }}>{label}</div>
    </Card>
  );
}
function AddTaskButton({ onClick, label = "Add task" }) {
  return (
    <button onClick={onClick} style={{ padding: "16px 0", borderRadius: 18, border: "none", background: "#c4b5fd", color: "#2e1065", fontSize: 16, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", gap: 8, cursor: "pointer" }}>
      <Icon name="plus" size={18} /> {label}
    </button>
  );
}
function Header() {
  return (
    <div style={{ padding: "22px 20px 16px", borderBottom: "1px solid #17151f" }}>
      <h1 style={{ margin: 0, fontSize: 28, fontWeight: 800, color: "#f5f3ff", letterSpacing: -0.3 }}>DayFlow</h1>
    </div>
  );
}
function NavItem({ label, iconName, active, onClick }) {
  return (
    <button onClick={onClick} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4, background: "none", border: "none", cursor: "pointer", padding: "10px 0" }}>
      <div style={{ width: 52, height: 30, borderRadius: 12, display: "flex", alignItems: "center", justifyContent: "center", background: active ? "#7c3aed" : "transparent" }}>
        <Icon name={iconName} size={18} color={active ? "#f5f3ff" : "#8b8896"} />
      </div>
      <span style={{ fontSize: 11, fontWeight: active ? 700 : 500, color: active ? "#f5f3ff" : "#8b8896" }}>{label}</span>
    </button>
  );
}

function CategoryCard({ category, dateKey, editable, completions, onToggle, onRemove, onEditTask }) {
  const iconName = ICON_MAP[category.icon] || "briefcase";
  const map = completions[dateKey] || {};
  const visibleSubtasks = category.subtasks.filter((s) => !s.deletedAt);
  const done = visibleSubtasks.filter((s) => map[s.id]).length;
  return (
    <Card>
      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
        <div style={{ width: 40, height: 40, borderRadius: 12, background: "#7c3aed", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
          <Icon name={iconName} size={19} color="#f5f3ff" />
        </div>
        <div style={{ fontSize: 17, fontWeight: 700, color: "#f5f3ff", flex: 1 }}>{category.name}</div>
        <div style={{ fontSize: 14, color: "#8b8896" }}>{done}/{visibleSubtasks.length}</div>
      </div>
      <div style={{ marginTop: 6 }}>
        {visibleSubtasks.map((s) => {
          const checked = !!map[s.id];
          const pinned = taskAllowsEdit(s) === false;
          return (
            <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "13px 0", borderTop: "1px solid #232132" }}>
              <div onClick={() => onToggle(s.id, dateKey)} style={{ width: 22, height: 22, borderRadius: 7, cursor: "pointer", border: checked ? "none" : "2px solid #4b4860", background: checked ? "#7c3aed" : "transparent", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                {checked && <Icon name="check" size={16} color="#7c3aed" />}
              </div>
              <div style={{ fontSize: 16, color: checked ? "#8b8896" : "#e7e5ef", flex: 1, textDecoration: checked ? "line-through" : "none", display: "flex", alignItems: "center", gap: 6 }}>
                {s.name}
                {pinned && <Icon name="lock" size={12} color="#6b6878" />}
              </div>
              {editable && (
                <>
                  <button onClick={() => onEditTask(category, s)} style={{ background: "none", border: "none", cursor: "pointer", padding: 4, color: "#8b8896" }} title="Rename or pin">
                    <Icon name="pencil" size={16} />
                  </button>
                  <button onClick={() => onRemove(category.id, s.id, s.name)} style={{ background: "none", border: "none", cursor: "pointer", padding: 4, color: "#8b6b6b" }} title="Delete task">
                    <Icon name="trash" size={16} />
                  </button>
                </>
              )}
            </div>
          );
        })}
        {visibleSubtasks.length === 0 && <div style={{ padding: "10px 0", color: "#6b6878", fontSize: 14 }}>No tasks in this category yet.</div>}
      </div>
    </Card>
  );
}

// ================= tabs =================
function CalendarTab({ viewYear, viewMonth, setViewYear, setViewMonth, today, todayKey, selectedDate, setSelectedDate, selectedKey, selectedDone, selectedPct, totalCount, doneForKey, categories, completions, onToggle, onRemove }) {
  const dim = daysInMonth(viewYear, viewMonth);
  const offset = firstDowOffset(viewYear, viewMonth);
  const cells = []; for (let i = 0; i < offset; i++) cells.push(null); for (let d = 1; d <= dim; d++) cells.push(d);
  function changeMonth(delta) { let m = viewMonth + delta, y = viewYear; if (m < 0) { m = 11; y -= 1; } if (m > 11) { m = 0; y += 1; } setViewMonth(m); setViewYear(y); }
  return (
    <div style={{ padding: "18px 20px 100px", display: "flex", flexDirection: "column", gap: 18 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end" }}>
        <div>
          <div style={{ fontSize: 12, letterSpacing: 1.5, color: "#8b8896", fontWeight: 600 }}>SELECTED DATE</div>
          <div style={{ fontSize: 24, fontWeight: 800, color: "#f5f3ff", marginTop: 4 }}>{fmtDate(selectedDate.y, selectedDate.m, selectedDate.d)}</div>
        </div>
        <div style={{ textAlign: "right" }}>
          <div style={{ fontSize: 26, fontWeight: 800, color: "#c4b5fd" }}>{selectedPct}%</div>
          <div style={{ fontSize: 13, color: "#8b8896" }}>complete</div>
        </div>
      </div>
      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div style={{ fontSize: 12, letterSpacing: 1.5, color: "#8b8896", fontWeight: 600 }}>MONTHLY OVERVIEW</div>
            <div style={{ fontSize: 21, fontWeight: 800, color: "#f5f3ff", marginTop: 4 }}>{MONTHS[viewMonth]} {viewYear}</div>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={() => changeMonth(-1)} style={navBtnStyle}><Icon name="chevronLeft" size={18} color="#d8d5e6" /></button>
            <button onClick={() => changeMonth(1)} style={navBtnStyle}><Icon name="chevronRight" size={18} color="#d8d5e6" /></button>
          </div>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", marginTop: 18, rowGap: 14 }}>
          {WEEKDAYS.map((w, i) => <div key={i} style={{ textAlign: "center", fontSize: 13, color: "#6b6878", fontWeight: 600 }}>{w}</div>)}
          {cells.map((d, i) => {
            if (!d) return <div key={i} />;
            const k = keyOf(viewYear, viewMonth, d);
            const isSelected = selectedDate.y === viewYear && selectedDate.m === viewMonth && selectedDate.d === d;
            const isToday = k === todayKey;
            const isPast = new Date(viewYear, viewMonth, d) < new Date(today.getFullYear(), today.getMonth(), today.getDate());
            const done = doneForKey(k);
            let dotColor = "#3b82f6";
            if (done === totalCount && totalCount > 0) dotColor = "#22c55e";
            if (isPast && done === 0 && totalCount > 0) dotColor = "#f97316";
            return (
              <div key={i} onClick={() => setSelectedDate({ y: viewYear, m: viewMonth, d })}
                style={{
                  textAlign: "center", cursor: "pointer", padding: "6px 0", borderRadius: 14,
                  background: isSelected ? "#c4b5fd" : "transparent",
                  border: isToday && !isSelected ? "1.5px solid #7c3aed" : "1.5px solid transparent",
                }}>
                <div style={{ fontSize: 16, fontWeight: 700, color: isSelected ? "#1e1b2e" : isToday ? "#c4b5fd" : "#e7e5ef" }}>{d}</div>
                <div style={{ display: "flex", justifyContent: "center", marginTop: 4 }}>
                  <span style={{ width: 5, height: 5, borderRadius: "50%", background: isSelected ? "#1e1b2e" : dotColor, display: "inline-block" }} />
                </div>
              </div>
            );
          })}
        </div>
        <div style={{ display: "flex", gap: 18, marginTop: 16, fontSize: 13, color: "#8b8896" }}>
          <span style={{ display: "flex", alignItems: "center", gap: 6 }}><span style={{ width: 6, height: 6, borderRadius: "50%", background: "#3b82f6", display: "inline-block" }} /> Scheduled</span>
          <span style={{ display: "flex", alignItems: "center", gap: 6 }}><span style={{ width: 6, height: 6, borderRadius: "50%", background: "#22c55e", display: "inline-block" }} /> Complete</span>
        </div>
      </Card>
      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div style={{ fontSize: 17, fontWeight: 700, color: "#f5f3ff" }}>
            {selectedKey === todayKey ? "Today's focus" : "Focus for this day"}
          </div>
          <div style={{ fontSize: 14, color: "#8b8896" }}>{selectedDone} / {totalCount} done</div>
        </div>
        <ProgressBar value={totalCount ? selectedDone / totalCount : 0} style={{ marginTop: 12 }} />
      </Card>
      <div style={{ fontSize: 17, fontWeight: 700, color: "#f5f3ff", marginTop: 4 }}>Tasks</div>
      {selectedKey !== todayKey && (
        <p style={{ fontSize: 12, color: "#6b6878", margin: "-12px 0 0" }}>
          {selectedKey < todayKey ? "This day's done — head to Insights if you need to fix anything." : "This day hasn't arrived yet."}
        </p>
      )}
      {categories.length === 0 && (
        <Card><div style={{ color: "#8b8896", fontSize: 15, textAlign: "center", padding: "10px 0" }}>No tasks yet. Head to Tasks to add your first one.</div></Card>
      )}
      {categories.map((c) => (
        <CategoryTaskGrid key={c.id} category={c} dateKey={selectedKey} completions={completions} onToggle={onToggle} readOnly={selectedKey !== todayKey} />
      ))}
    </div>
  );
}

function GridTile({ name, iconName, checked, onClick, readOnly }) {
  return (
    <div onClick={readOnly ? undefined : onClick}
      style={{
        padding: "16px 14px", borderRadius: 18, cursor: readOnly ? "default" : "pointer",
        background: checked ? "#7c3aed" : "#151420",
        border: `1px solid ${checked ? "#7c3aed" : "#232132"}`,
        opacity: readOnly ? 0.85 : 1,
        display: "flex", flexDirection: "column", gap: 10, minHeight: 84,
        transition: "background .15s, border-color .15s",
      }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <Icon name={iconName} size={16} color={checked ? "#ede9fe" : "#c4b5fd"} />
        <div style={{ width: 20, height: 20, borderRadius: 6, border: checked ? "none" : "2px solid #4b4860", background: checked ? "#f5f3ff" : "transparent", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
          {checked && <Icon name="check" size={13} color="#7c3aed" />}
        </div>
      </div>
      <div style={{ fontSize: 15, fontWeight: 600, color: checked ? "#f5f3ff" : "#e7e5ef", lineHeight: 1.3 }}>{name}</div>
    </div>
  );
}

function CategoryTaskGrid({ category, dateKey, completions, onToggle, readOnly }) {
  const visible = category.subtasks.filter((s) => !s.deletedAt);
  if (visible.length === 0) return null;
  const map = completions[dateKey] || {};
  const iconName = ICON_MAP[category.icon] || "briefcase";
  const done = visible.filter((s) => map[s.id]).length;
  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <Icon name={iconName} size={16} color="#c4b5fd" />
        <div style={{ fontSize: 15, fontWeight: 700, color: "#f5f3ff", flex: 1 }}>{category.name}</div>
        <div style={{ fontSize: 13, color: "#8b8896" }}>{done}/{visible.length}</div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        {visible.map((s) => (
          <GridTile key={s.id} name={s.name} iconName={iconName} checked={!!map[s.id]} onClick={() => onToggle(s.id, dateKey)} readOnly={readOnly} />
        ))}
      </div>
    </div>
  );
}

function TasksTab({ categories, selectedKey, completions, onToggle, onRemove, onAddTask, onEditTask }) {
  return (
    <div style={{ padding: "18px 20px 100px", display: "flex", flexDirection: "column", gap: 16 }}>
      <div>
        <div style={{ fontSize: 26, fontWeight: 800, color: "#f5f3ff" }}>Your tasks</div>
      </div>
      {categories.length === 0 && (
        <Card><div style={{ color: "#8b8896", fontSize: 15, textAlign: "center", padding: "10px 0" }}>You have no tasks yet. Tap below to add your first one.</div></Card>
      )}
      {categories.map((c) => (
        <CategoryCard key={c.id} category={c} dateKey={selectedKey} editable completions={completions} onToggle={onToggle} onRemove={onRemove} onEditTask={onEditTask} />
      ))}
      <AddTaskButton onClick={onAddTask} label="Create task" />
    </div>
  );
}

function DayDetailModal({ dayKey, onClose, categories, completions, onToggle }) {
  if (!dayKey) return null;
  const [y, m, d] = dayKey.split("-").map(Number);
  const map = completions[dayKey] || {};
  const activeIds = activeSubtaskIdsForDate(categories, dayKey, "all");
  const done = activeIds.filter((id) => map[id]).length;
  const total = activeIds.length;
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 55 }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{ width: "100%", maxWidth: 480, maxHeight: "78vh", overflowY: "auto", background: "#17151f", borderRadius: "24px 24px 0 0", padding: 24, borderTop: "1px solid #2a2740" }}>
        <div style={{ width: 40, height: 4, borderRadius: 4, background: "#3a3750", margin: "0 auto 18px" }} />
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
          <div>
            <div style={{ fontSize: 12, letterSpacing: 1.5, color: "#8b8896", fontWeight: 600 }}>{fmtDate(y, m - 1, d).toUpperCase()}</div>
            <div style={{ fontSize: 24, fontWeight: 800, color: "#f5f3ff", marginTop: 4 }}>{done}/{total} tasks done</div>
          </div>
          <button onClick={onClose} style={{ ...navBtnStyle, width: 32, height: 32 }}><Icon name="x" size={16} color="#d8d5e6" /></button>
        </div>
        <ProgressBar value={total ? done / total : 0} style={{ marginTop: 14, marginBottom: 18 }} />
        {categories.length === 0 && <div style={{ color: "#6b6878", fontSize: 14 }}>No tasks yet.</div>}
        {categories.map((c) => {
          const iconName = ICON_MAP[c.icon] || "briefcase";
          const visible = c.subtasks.filter((s) => isTaskActiveOnDate(s, dayKey));
          if (visible.length === 0) return null;
          return (
            <div key={c.id} style={{ marginBottom: 16 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                <Icon name={iconName} size={15} color="#c4b5fd" />
                <div style={{ fontSize: 14, fontWeight: 700, color: "#c4b5fd" }}>{c.name}</div>
              </div>
              {visible.map((s) => {
                const checked = !!map[s.id];
                const editable = categoryAllowsEdit(c) && taskAllowsEdit(s);
                return (
                  <div key={s.id} onClick={editable ? () => onToggle(s.id, dayKey) : undefined}
                    style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0 8px 4px", cursor: editable ? "pointer" : "default" }}>
                    <div style={{ width: 18, height: 18, borderRadius: 6, border: checked ? "none" : "2px solid #4b4860", background: checked ? (editable ? "#7c3aed" : "#22c55e") : "transparent", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                      {checked && <Icon name="check" size={13} color={editable ? "#7c3aed" : "#22c55e"} />}
                    </div>
                    <div style={{ fontSize: 15, color: checked ? "#e7e5ef" : "#6b6878", flex: 1 }}>{s.name}</div>
                    {!editable && <Icon name="lock" size={12} color="#6b6878" />}
                  </div>
                );
              })}
            </div>
          );
        })}
        <p style={{ fontSize: 12, color: "#6b6878", marginTop: 4, marginBottom: 0 }}>
          Tasks with a lock icon can't be edited here.
        </p>
      </div>
    </div>
  );
}

function InsightsTab({ categories, completions, todayKey, today, onToggle }) {
  const [detailDay, setDetailDay] = useState(null);
  const [filterId, setFilterId] = useState("all");
  const selectedCategory = filterId !== "all" ? categories.find((c) => c.id === filterId) : null;
  // If the selected category got deleted from under us, fall back to Overall.
  if (filterId !== "all" && !selectedCategory) { setFilterId("all"); }

  const rhythm = useMemo(() => computeRhythm(categories, completions, today, todayKey, filterId), [categories, completions, today, todayKey, filterId]);
  const streaks = useMemo(() => computeStreak(categories, completions, today, filterId), [categories, completions, today, filterId]);
  const weekTotal = rhythm.reduce((a, b) => a + b.done, 0);
  const weekPossible = rhythm.reduce((a, b) => a + b.total, 0);

  const todayIds = activeSubtaskIdsForDate(categories, todayKey, filterId);
  const todayMap = completions[todayKey] || {};
  const todayDone = todayIds.filter((id) => todayMap[id]).length;
  const todayTotal = todayIds.length;
  const todayPct = todayTotal ? Math.round((todayDone / todayTotal) * 100) : 0;

  const ringSize = 92, stroke = 9, r = (ringSize - stroke) / 2, circumference = 2 * Math.PI * r;
  const ringOffset = circumference - (todayPct / 100) * circumference;

  const filterOptions = [{ id: "all", name: "Overall" }, ...categories];

  return (
    <div style={{ padding: "18px 20px 100px", display: "flex", flexDirection: "column", gap: 16 }}>
      <div>
        <div style={{ fontSize: 26, fontWeight: 800, color: "#f5f3ff" }}>Insights</div>
      </div>

      <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 2 }}>
        {filterOptions.map((opt) => {
          const active = filterId === opt.id;
          return (
            <button key={opt.id} onClick={() => setFilterId(opt.id)} style={{
              padding: "8px 16px", borderRadius: 20, border: `1px solid ${active ? "#7c3aed" : "#2a2740"}`,
              background: active ? "#7c3aed" : "#151420", color: active ? "#f5f3ff" : "#c9c6d3",
              fontSize: 14, fontWeight: 600, whiteSpace: "nowrap", cursor: "pointer", flexShrink: 0,
            }}>{opt.name}</button>
          );
        })}
      </div>

      <Card style={{ display: "flex", alignItems: "center", gap: 20 }}>
        <div style={{ position: "relative", width: ringSize, height: ringSize, flexShrink: 0 }}>
          <svg width={ringSize} height={ringSize} style={{ transform: "rotate(-90deg)" }}>
            <circle cx={ringSize / 2} cy={ringSize / 2} r={r} stroke="#232132" strokeWidth={stroke} fill="none" />
            <circle cx={ringSize / 2} cy={ringSize / 2} r={r} stroke="url(#ringGrad)" strokeWidth={stroke} fill="none"
              strokeDasharray={circumference} strokeDashoffset={ringOffset} strokeLinecap="round" style={{ transition: "stroke-dashoffset .4s" }} />
            <defs><linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stopColor="#a78bfa" /><stop offset="100%" stopColor="#c4b5fd" />
            </linearGradient></defs>
          </svg>
          <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column" }}>
            <div style={{ fontSize: 20, fontWeight: 800, color: "#f5f3ff" }}>{todayPct}%</div>
          </div>
        </div>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 17, fontWeight: 700, color: "#f5f3ff" }}>{selectedCategory ? selectedCategory.name : "Today"}</div>
          <div style={{ fontSize: 14, color: "#8b8896", marginTop: 2 }}>{todayDone} of {todayTotal} tasks complete</div>
          <button onClick={() => setDetailDay(todayKey)} style={{ marginTop: 10, background: "none", border: "none", color: "#c4b5fd", fontSize: 14, fontWeight: 700, cursor: "pointer", padding: 0 }}>
            View today's tasks →
          </button>
        </div>
      </Card>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 10 }}>
        <StatBox iconName="check" iconColor="#22c55e" value={`${weekTotal}/${weekPossible}`} label="This week" />
        <StatBox iconName="flame" iconColor="#f97316" value={`${streaks.current}d`} label="Current streak" />
        <StatBox iconName="trophy" iconColor="#c4b5fd" value={`${streaks.longest}d`} label="Longest" />
      </div>

      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div style={{ fontSize: 12, letterSpacing: 1.5, color: "#8b8896", fontWeight: 600 }}>LAST 7 DAYS</div>
            <div style={{ fontSize: 20, fontWeight: 800, color: "#f5f3ff", marginTop: 4 }}>Your rhythm</div>
          </div>
          <div style={{ color: "#22c55e", fontWeight: 700 }}>{weekTotal}/{weekPossible} done</div>
        </div>
        <p style={{ fontSize: 12, color: "#6b6878", marginTop: 4, marginBottom: 0 }}>Tap a day for details</p>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginTop: 20 }}>
          {rhythm.map((d, i) => {
            const pct = d.total ? (d.done / d.total) * 100 : 0;
            return (
              <div key={i} onClick={() => setDetailDay(d.k)} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 8, flex: 1, cursor: "pointer" }}>
                <div style={{ width: 20, height: 90, borderRadius: 8, background: "#232132", display: "flex", alignItems: "flex-end", overflow: "hidden", border: d.isToday ? "1px solid #7c3aed" : "1px solid transparent" }}>
                  <div style={{ width: "100%", height: `${pct}%`, background: d.total > 0 && d.done === d.total ? "linear-gradient(180deg,#4ade80,#22c55e)" : d.isToday ? "linear-gradient(180deg,#a78bfa,#7c3aed)" : "#a78bfa", borderRadius: 8 }} />
                </div>
                <div style={{ fontSize: 12, color: "#e7e5ef", fontWeight: 600 }}>{d.done}/{d.total}</div>
                <div style={{ fontSize: 12, color: d.isToday ? "#c4b5fd" : "#6b6878", fontWeight: d.isToday ? 700 : 400 }}>{d.label}</div>
              </div>
            );
          })}
        </div>
      </Card>

      {selectedCategory ? (
        <WeeklyCoverageCard category={selectedCategory} rhythm={rhythm} completions={completions} />
      ) : (
        <Card>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
            <div>
              <div style={{ fontSize: 12, letterSpacing: 1.5, color: "#8b8896", fontWeight: 600 }}>CATEGORY BREAKDOWN</div>
              <div style={{ fontSize: 20, fontWeight: 800, color: "#f5f3ff", marginTop: 4, marginBottom: 14 }}>Where today's effort went</div>
            </div>
          </div>
          {categories.length === 0 && <div style={{ color: "#6b6878", fontSize: 14 }}>Nothing to show yet.</div>}
          {categories.map((c) => {
            const iconName = ICON_MAP[c.icon] || "briefcase";
            const visible = c.subtasks.filter((s) => !s.deletedAt);
            const map = completions[todayKey] || {};
            const done = visible.filter((s) => map[s.id]).length;
            const pct = visible.length ? Math.round((done / visible.length) * 100) : 0;
            return (
              <div key={c.id} style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 14 }}>
                <Icon name={iconName} size={17} color="#c4b5fd" />
                <div style={{ fontSize: 15, color: "#e7e5ef", width: 78 }}>{c.name}</div>
                <ProgressBar value={visible.length ? done / visible.length : 0} style={{ flex: 1 }} />
                <div style={{ fontSize: 13, color: "#8b8896", width: 62, textAlign: "right" }}>{done}/{visible.length} · {pct}%</div>
              </div>
            );
          })}
        </Card>
      )}

      <DayDetailModal dayKey={detailDay} onClose={() => setDetailDay(null)} categories={categories} completions={completions} onToggle={onToggle} />
    </div>
  );
}

function WeeklyCoverageCard({ category, rhythm, completions }) {
  const visible = category.subtasks.filter((s) => !s.deletedAt);
  const coveredCount = visible.filter((s) => rhythm.some((d) => (completions[d.k] || {})[s.id])).length;
  return (
    <Card>
      <div style={{ fontSize: 12, letterSpacing: 1.5, color: "#8b8896", fontWeight: 600 }}>WEEKLY COVERAGE</div>
      <div style={{ fontSize: 20, fontWeight: 800, color: "#f5f3ff", marginTop: 4 }}>{category.name} this week</div>
      <p style={{ fontSize: 13, color: "#8b8896", marginTop: 4, marginBottom: 0 }}>
        {coveredCount}/{visible.length} tasks got done at least once — no need to hit them all on the same day.
      </p>
      {visible.length === 0 ? (
        <div style={{ color: "#6b6878", fontSize: 14, marginTop: 14 }}>No tasks in this category yet.</div>
      ) : (
        <div style={{ overflowX: "auto", marginTop: 16 }}>
          <div style={{ display: "grid", gridTemplateColumns: `minmax(90px,1fr) repeat(7, 28px)`, rowGap: 12, columnGap: 6, minWidth: 90 + 7 * 28 + 6 * 6, alignItems: "center" }}>
            <div />
            {rhythm.map((d, i) => (
              <div key={i} style={{ textAlign: "center", fontSize: 11, color: d.isToday ? "#c4b5fd" : "#6b6878", fontWeight: d.isToday ? 700 : 400 }}>{d.label}</div>
            ))}
            {visible.map((s) => (
              <React.Fragment key={s.id}>
                <div style={{ fontSize: 13, color: "#e7e5ef", paddingRight: 6, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{s.name}</div>
                {rhythm.map((d, i) => {
                  const done = !!(completions[d.k] || {})[s.id];
                  return <div key={i} style={{ width: 22, height: 22, borderRadius: 7, margin: "0 auto", background: done ? "#22c55e" : "#232132", border: done ? "none" : "1px solid #2f2c40" }} />;
                })}
              </React.Fragment>
            ))}
          </div>
        </div>
      )}
    </Card>
  );
}

        <label style={{ display: "block", marginTop: 10, width: "100%", padding: "12px 0", borderRadius: 14, cursor: "pointer", border: "1px solid #3a3750", background: "transparent", color: "#e7e5ef", fontSize: 15, fontWeight: 600, textAlign: "center" }}>

      </Card>
    </div>

      <div onClick={(e) => e.stopPropagation()} style={{ width: "100%", maxWidth: 480, background: "#17151f", borderRadius: "24px 24px 0 0", padding: 24, borderTop: "1px solid #2a2740" }}>

function EditCategoryModal({ editCategory, setEditCategory, onClose, onSave }) {
  if (!editCategory) return null;
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 50 }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{ width: "100%", maxWidth: 480, background: "#17151f", borderRadius: "24px 24px 0 0", padding: 24, borderTop: "1px solid #2a2740" }}>
        <div style={{ width: 40, height: 4, borderRadius: 4, background: "#3a3750", margin: "0 auto 18px" }} />
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
          <div>
            <div style={{ fontSize: 12, letterSpacing: 1.5, color: "#8b8896", fontWeight: 600 }}>EDIT CATEGORY</div>
            <div style={{ fontSize: 24, fontWeight: 800, color: "#f5f3ff", marginTop: 4 }}>{editCategory.name || "Category"}</div>
          </div>
          <button onClick={onClose} style={{ ...navBtnStyle, width: 32, height: 32 }}><Icon name="x" size={16} color="#d8d5e6" /></button>
        </div>
        <input autoFocus value={editCategory.name} onChange={(e) => setEditCategory({ ...editCategory, name: e.target.value })} placeholder="Category name"
          onKeyDown={(e) => e.key === "Enter" && onSave()}
          style={{ width: "100%", marginTop: 18, padding: "16px 18px", borderRadius: 16, border: "1px solid #2a2740", background: "#100e18", color: "#f5f3ff", fontSize: 16, outline: "none", boxSizing: "border-box" }} />
        <AllowEditField checked={editCategory.allowEdit} onChange={(v) => setEditCategory({ ...editCategory, allowEdit: v })} />
        <button onClick={onSave} disabled={!editCategory.name.trim()} style={{ width: "100%", marginTop: 18, padding: "16px 0", borderRadius: 16, border: "none", background: editCategory.name.trim() ? "#c4b5fd" : "#3a3750", color: editCategory.name.trim() ? "#2e1065" : "#8b8896", fontSize: 16, fontWeight: 700, cursor: editCategory.name.trim() ? "pointer" : "default" }}>Save changes</button>
      </div>
    </div>
  );
}

function EditTaskModal({ editTask, setEditTask, onClose, onSave }) {
  if (!editTask) return null;
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 50 }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{ width: "100%", maxWidth: 480, background: "#17151f", borderRadius: "24px 24px 0 0", padding: 24, borderTop: "1px solid #2a2740" }}>
        <div style={{ width: 40, height: 4, borderRadius: 4, background: "#3a3750", margin: "0 auto 18px" }} />
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
          <div>
            <div style={{ fontSize: 12, letterSpacing: 1.5, color: "#8b8896", fontWeight: 600 }}>EDIT TASK</div>
            <div style={{ fontSize: 24, fontWeight: 800, color: "#f5f3ff", marginTop: 4 }}>{editTask.name || "Task"}</div>
          </div>
          <button onClick={onClose} style={{ ...navBtnStyle, width: 32, height: 32 }}><Icon name="x" size={16} color="#d8d5e6" /></button>
        </div>
        <input autoFocus value={editTask.name} onChange={(e) => setEditTask({ ...editTask, name: e.target.value })} placeholder="Task name"
          onKeyDown={(e) => e.key === "Enter" && onSave()}
          style={{ width: "100%", marginTop: 18, padding: "16px 18px", borderRadius: 16, border: "1px solid #2a2740", background: "#100e18", color: "#f5f3ff", fontSize: 16, outline: "none", boxSizing: "border-box" }} />
        <AllowEditField checked={editTask.allowEdit} onChange={(v) => setEditTask({ ...editTask, allowEdit: v })}
          title="Allow editing past days"
          description="Lets you fix this specific task for past dates from Insights. Each task has its own setting, separate from its category." />
        <button onClick={onSave} disabled={!editTask.name.trim()} style={{ width: "100%", marginTop: 18, padding: "16px 0", borderRadius: 16, border: "none", background: editTask.name.trim() ? "#c4b5fd" : "#3a3750", color: editTask.name.trim() ? "#2e1065" : "#8b8896", fontSize: 16, fontWeight: 700, cursor: editTask.name.trim() ? "pointer" : "default" }}>Save changes</button>
      </div>
    </div>
  );
}

function AddTaskModal({ show, categories, categoryId, setCategoryId, taskName, setTaskName, useNewCategory, setUseNewCategory, newCategoryName, setNewCategoryName, newCategoryAllowEdit, setNewCategoryAllowEdit, onClose, onSubmit }) {
  if (!show) return null;
  const canSubmit = taskName.trim() && (useNewCategory ? newCategoryName.trim() : categoryId);
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 50 }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{ width: "100%", maxWidth: 480, background: "#17151f", borderRadius: "24px 24px 0 0", padding: 24, borderTop: "1px solid #2a2740" }}>
        <div style={{ width: 40, height: 4, borderRadius: 4, background: "#3a3750", margin: "0 auto 18px" }} />
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
          <div>
            <div style={{ fontSize: 12, letterSpacing: 1.5, color: "#8b8896", fontWeight: 600 }}>NEW TASK</div>
            <div style={{ fontSize: 24, fontWeight: 800, color: "#f5f3ff", marginTop: 4 }}>Add task</div>
          </div>
          <button onClick={onClose} style={{ ...navBtnStyle, width: 32, height: 32 }}><Icon name="x" size={16} color="#d8d5e6" /></button>
        </div>

        <div style={{ marginTop: 18 }}>
          <div style={{ fontSize: 13, color: "#8b8896", fontWeight: 600, marginBottom: 8 }}>Category</div>
          {!useNewCategory && categories.length > 0 ? (
            <select value={categoryId} onChange={(e) => setCategoryId(e.target.value)}
              style={{ width: "100%", padding: "14px 16px", borderRadius: 14, border: "1px solid #2a2740", background: "#100e18", color: "#f5f3ff", fontSize: 16, outline: "none" }}>
              {categories.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          ) : (
            <input value={newCategoryName} onChange={(e) => setNewCategoryName(e.target.value)} placeholder="e.g. Work"
              style={{ width: "100%", padding: "14px 16px", borderRadius: 14, border: "1px solid #2a2740", background: "#100e18", color: "#f5f3ff", fontSize: 16, outline: "none", boxSizing: "border-box" }} />
          )}
          {useNewCategory && <AllowEditField checked={newCategoryAllowEdit} onChange={setNewCategoryAllowEdit} />}
          {categories.length > 0 && (
            <button onClick={() => setUseNewCategory((v) => !v)} style={{ background: "none", border: "none", color: "#c4b5fd", fontSize: 14, fontWeight: 600, cursor: "pointer", marginTop: 8, padding: 0 }}>
              {useNewCategory ? "Choose an existing category instead" : "+ Use a new category instead"}
            </button>
          )}
        </div>

        <div style={{ marginTop: 16 }}>
          <div style={{ fontSize: 13, color: "#8b8896", fontWeight: 600, marginBottom: 8 }}>Task name</div>
          <input value={taskName} onChange={(e) => setTaskName(e.target.value)} placeholder="e.g. Yoga"
            onKeyDown={(e) => e.key === "Enter" && canSubmit && onSubmit()}
            style={{ width: "100%", padding: "14px 16px", borderRadius: 14, border: "1px solid #2a2740", background: "#100e18", color: "#f5f3ff", fontSize: 16, outline: "none", boxSizing: "border-box" }} />
        </div>

        <button onClick={onSubmit} disabled={!canSubmit} style={{ width: "100%", marginTop: 18, padding: "16px 0", borderRadius: 16, border: "none", background: canSubmit ? "#c4b5fd" : "#3a3750", color: canSubmit ? "#2e1065" : "#8b8896", fontSize: 16, fontWeight: 700, cursor: canSubmit ? "pointer" : "default" }}>Add task</button>
      </div>
    </div>
  );
}

function ConfirmModal({ confirmState, onCancel, onConfirm }) {
  if (!confirmState) return null;
  const { title, message, confirmLabel, danger } = confirmState;
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.65)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 70, padding: 24 }} onClick={onCancel}>
      <div onClick={(e) => e.stopPropagation()} style={{ width: "100%", maxWidth: 360, background: "#17151f", borderRadius: 24, padding: 24, border: "1px solid #2a2740", boxShadow: "0 20px 60px rgba(0,0,0,0.5)" }}>
        <div style={{
          width: 44, height: 44, borderRadius: 14, marginBottom: 14,
          background: danger ? "rgba(224,160,160,0.12)" : "rgba(124,58,237,0.15)",
          display: "flex", alignItems: "center", justifyContent: "center",
        }}>
          <Icon name={danger ? "trash" : "check"} size={20} color={danger ? "#e0a0a0" : "#c4b5fd"} />
        </div>
        <div style={{ fontSize: 19, fontWeight: 800, color: "#f5f3ff" }}>{title}</div>
        <p style={{ fontSize: 14, color: "#a8a5b5", marginTop: 8, lineHeight: 1.5 }}>{message}</p>
        <div style={{ display: "flex", gap: 10, marginTop: 20 }}>
          <button onClick={onCancel} style={{ flex: 1, padding: "13px 0", borderRadius: 14, border: "1px solid #3a3750", background: "transparent", color: "#e7e5ef", fontSize: 15, fontWeight: 600, cursor: "pointer" }}>
            Cancel
          </button>
          <button onClick={onConfirm} style={{
            flex: 1, padding: "13px 0", borderRadius: 14, border: "none", fontSize: 15, fontWeight: 700, cursor: "pointer",
            background: danger ? "#e0a0a0" : "#c4b5fd", color: danger ? "#3a1414" : "#2e1065",
          }}>
            {confirmLabel}
          </button>
        </div>
      </div>
    </div>
  );
}

function Toast({ message }) {
  if (!message) return null;
  return (
    <div style={{ position: "fixed", bottom: 90, left: "50%", transform: "translateX(-50%)", background: "#232132", color: "#f5f3ff", padding: "10px 18px", borderRadius: 12, fontSize: 14, fontWeight: 600, boxShadow: "0 6px 20px rgba(0,0,0,0.4)", zIndex: 60 }}>
      {message}
    </div>
  );
}

// ================= root app =================
function DayFlow() {
  const today = useMemo(() => new Date(), []);
  const [tab, setTab] = useState("calendar");

  const [categories, setCategories] = useState(() => loadJSON(LS_CATEGORIES, DEFAULT_CATEGORIES));
  const [completions, setCompletions] = useState(() => loadJSON(LS_COMPLETIONS, {}));

  const [viewYear, setViewYear] = useState(today.getFullYear());
  const [viewMonth, setViewMonth] = useState(today.getMonth());
  const [selectedDate, setSelectedDate] = useState({ y: today.getFullYear(), m: today.getMonth(), d: today.getDate() });

  const [showNewCategory, setShowNewCategory] = useState(false);
  const [newCategoryName, setNewCategoryName] = useState("");
  const [newCategoryAllowEdit, setNewCategoryAllowEdit] = useState(true);

  const [editCategory, setEditCategory] = useState(null); // { id, name, allowEdit }
  const [editTask, setEditTask] = useState(null); // { categoryId, subtaskId, name, allowEdit }

  const [showAddTask, setShowAddTask] = useState(false);
  const [addTaskCategoryId, setAddTaskCategoryId] = useState(categories[0]?.id || "");
  const [addTaskName, setAddTaskName] = useState("");
  const [addTaskNewCategory, setAddTaskNewCategory] = useState(categories.length === 0);
  const [addTaskNewCategoryName, setAddTaskNewCategoryName] = useState("");
  const [addTaskNewCategoryAllowEdit, setAddTaskNewCategoryAllowEdit] = useState(true);

  const [toast, setToast] = useState(null);
  function showToast(msg) { setToast(msg); setTimeout(() => setToast((t) => (t === msg ? null : t)), 1800); }

  const [confirmState, setConfirmState] = useState(null);
  function askConfirm({ title, message, confirmLabel = "Delete", danger = true, onConfirm }) {
    setConfirmState({ title, message, confirmLabel, danger, onConfirm });
  }

  // One-time cleanup: earlier versions auto-filled fake sample history on first load.
  // Wipe it once, automatically, so existing installs end up on the same clean slate as a fresh one.
  useEffect(() => {
    if (!loadJSON(LS_MIGRATION_CLEAN_SEED, false)) {
      setCompletions({});
      saveJSON(LS_MIGRATION_CLEAN_SEED, true);
    }
  }, []);

  useEffect(() => { saveJSON(LS_CATEGORIES, categories); }, [categories]);
  useEffect(() => { saveJSON(LS_COMPLETIONS, completions); }, [completions]);

  const allSubtasks = useMemo(() => categories.flatMap((c) => c.subtasks.filter((s) => !s.deletedAt).map((s) => ({ ...s, categoryId: c.id }))), [categories]);
  const totalCount = allSubtasks.length;
  const selectedKey = keyOf(selectedDate.y, selectedDate.m, selectedDate.d);
  const todayKey = keyOf(today.getFullYear(), today.getMonth(), today.getDate());
  const doneForKey = (k) => { const map = completions[k] || {}; return allSubtasks.filter((s) => map[s.id]).length; };
  const selectedDone = doneForKey(selectedKey);
  const selectedPct = totalCount ? Math.round((selectedDone / totalCount) * 100) : 0;

  function toggleSubtask(subtaskId, k = selectedKey) {
    setCompletions((prev) => { const map = { ...(prev[k] || {}) }; map[subtaskId] = !map[subtaskId]; return { ...prev, [k]: map }; });
  }

  function handleCreateCategory() {
    const name = newCategoryName.trim();
    if (!name) return;
    const id = uid(name);
    setCategories((prev) => [...prev, { id, name, icon: "Dot", allowEdit: newCategoryAllowEdit, subtasks: [] }]);
    setNewCategoryName(""); setNewCategoryAllowEdit(true); setShowNewCategory(false);
    showToast(`Added "${name}" category`);
  }

  function handleDeleteCategory(categoryId, categoryName) {
    askConfirm({
      title: "Delete category?",
      message: `Delete "${categoryName}" and all its tasks? This can't be undone.`,
      confirmLabel: "Delete",
      onConfirm: () => {
        setCategories((prev) => prev.filter((c) => c.id !== categoryId));
        showToast(`Deleted "${categoryName}"`);
      },
    });
  }

  function handleSaveEditCategory() {
    if (!editCategory || !editCategory.name.trim()) return;
    setCategories((prev) => prev.map((c) => (c.id === editCategory.id ? { ...c, name: editCategory.name.trim(), allowEdit: editCategory.allowEdit } : c)));
    showToast("Category updated");
    setEditCategory(null);
  }

  function handleSaveEditTask() {
    if (!editTask || !editTask.name.trim()) return;
    setCategories((prev) => prev.map((c) => (c.id === editTask.categoryId
      ? { ...c, subtasks: c.subtasks.map((s) => (s.id === editTask.subtaskId ? { ...s, name: editTask.name.trim(), allowEdit: editTask.allowEdit } : s)) }
      : c)));
    showToast("Task updated");
    setEditTask(null);
  }

  function handleRemoveSubtask(categoryId, subtaskId, subtaskName) {
    askConfirm({
      title: "Delete task?",
      message: `Delete "${subtaskName}"? Days before today keep their record of it; it just won't show up from today onward.`,
      confirmLabel: "Delete",
      onConfirm: () => {
        setCategories((prev) => prev.map((c) => (c.id === categoryId
          ? { ...c, subtasks: c.subtasks.map((s) => (s.id === subtaskId ? { ...s, deletedAt: todayKey } : s)) }
          : c)));
        showToast("Task deleted");
      },
    });
  }

  function openAddTask() {
    setAddTaskCategoryId(categories[0]?.id || "");
    setAddTaskNewCategory(categories.length === 0);
    setAddTaskNewCategoryName("");
    setAddTaskNewCategoryAllowEdit(true);
    setAddTaskName("");
    setShowAddTask(true);
  }

  function handleSubmitAddTask() {
    const taskName = addTaskName.trim();
    if (!taskName) return;
    let categoryId = addTaskCategoryId;
    if (addTaskNewCategory) {
      const catName = addTaskNewCategoryName.trim();
      if (!catName) return;
      categoryId = uid(catName);
      setCategories((prev) => [...prev, { id: categoryId, name: catName, icon: "Dot", allowEdit: addTaskNewCategoryAllowEdit, subtasks: [{ id: uid(taskName), name: taskName, allowEdit: true }] }]);
    } else {
      if (!categoryId) return;
      setCategories((prev) => prev.map((c) => (c.id === categoryId ? { ...c, subtasks: [...c.subtasks, { id: uid(taskName), name: taskName, allowEdit: true }] } : c)));
    }
    showToast(`Added "${taskName}"`);
    setShowAddTask(false);
  }

  function handleExport() {
    const data = { categories, completions, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "dayflow-backup.json"; a.click();
    URL.revokeObjectURL(url);
    showToast("Backup downloaded");
  }
  function handleImport(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (data.categories) setCategories(data.categories);
        if (data.completions) setCompletions(data.completions);
        showToast("Backup restored");
      } catch (err) { showToast("Couldn't read that file"); }
    };
    reader.readAsText(file);
    e.target.value = "";
  }
  function handleResetAll() {
    askConfirm({
      title: "Erase everything?",
      message: "This wipes all tasks, categories, and history, and starts fresh with the defaults. This can't be undone.",
      confirmLabel: "Erase & reset",
      onConfirm: () => {
        setCategories(DEFAULT_CATEGORIES);
        setCompletions({});
        showToast("Reset to defaults");
      },
    });
  }

  return (
    <div className="app-shell" style={{ width: "100%", background: "#0a0910", display: "flex", flexDirection: "column", position: "relative", overflow: "hidden" }}>
      <div style={{ flex: 1, overflowY: "auto" }}>
        <Header />
        {tab === "calendar" && (
          <CalendarTab
            viewYear={viewYear} viewMonth={viewMonth} setViewYear={setViewYear} setViewMonth={setViewMonth}
            today={today} todayKey={todayKey} selectedDate={selectedDate} setSelectedDate={setSelectedDate}
            selectedKey={selectedKey} selectedDone={selectedDone} selectedPct={selectedPct} totalCount={totalCount}
            doneForKey={doneForKey} categories={categories} completions={completions}
            onToggle={toggleSubtask} onRemove={handleRemoveSubtask}
          />
        )}
        {tab === "tasks" && (
          <TasksTab categories={categories} selectedKey={selectedKey} completions={completions}
            onToggle={toggleSubtask} onRemove={handleRemoveSubtask} onAddTask={openAddTask} onEditTask={(c, s) => setEditTask({ categoryId: c.id, subtaskId: s.id, name: s.name, allowEdit: taskAllowsEdit(s) })} />
        )}
        {tab === "insights" && (
          <InsightsTab categories={categories} completions={completions} todayKey={todayKey} today={today} onToggle={toggleSubtask} />
        )}
        {tab === "settings" && (
          <SettingsTab
            categories={categories}
            onAddCategoryClick={() => setShowNewCategory(true)}
            onEditCategory={(c) => setEditCategory({ id: c.id, name: c.name, allowEdit: categoryAllowsEdit(c) })}
            onDeleteCategory={handleDeleteCategory}
            onExport={handleExport} onImport={handleImport} onResetAll={handleResetAll}
          />
        )}
      </div>
      <div className="bottom-nav" style={{ display: "flex", borderTop: "1px solid #1c1a28", background: "#0d0c14", paddingBottom: "env(safe-area-inset-bottom, 6px)" }}>
        <NavItem label="Calendar" iconName="calendar" active={tab === "calendar"} onClick={() => setTab("calendar")} />
        <NavItem label="Tasks" iconName="check" active={tab === "tasks"} onClick={() => setTab("tasks")} />
        <NavItem label="Insights" iconName="trending" active={tab === "insights"} onClick={() => setTab("insights")} />
        <NavItem label="Settings" iconName="settings" active={tab === "settings"} onClick={() => setTab("settings")} />
      </div>

      <NewCategoryModal
        show={showNewCategory} name={newCategoryName} setName={setNewCategoryName}
        allowEdit={newCategoryAllowEdit} setAllowEdit={setNewCategoryAllowEdit}
        onClose={() => setShowNewCategory(false)} onCreate={handleCreateCategory}
      />
      <EditCategoryModal
        editCategory={editCategory} setEditCategory={setEditCategory}
        onClose={() => setEditCategory(null)} onSave={handleSaveEditCategory}
      />
      <EditTaskModal
        editTask={editTask} setEditTask={setEditTask}
        onClose={() => setEditTask(null)} onSave={handleSaveEditTask}
      />
      <AddTaskModal
        show={showAddTask} categories={categories}
        categoryId={addTaskCategoryId} setCategoryId={setAddTaskCategoryId}
        taskName={addTaskName} setTaskName={setAddTaskName}
        useNewCategory={addTaskNewCategory} setUseNewCategory={setAddTaskNewCategory}
        newCategoryName={addTaskNewCategoryName} setNewCategoryName={setAddTaskNewCategoryName}
        newCategoryAllowEdit={addTaskNewCategoryAllowEdit} setNewCategoryAllowEdit={setAddTaskNewCategoryAllowEdit}
        onClose={() => setShowAddTask(false)} onSubmit={handleSubmitAddTask}
      />
      <ConfirmModal
        confirmState={confirmState}
        onCancel={() => setConfirmState(null)}
        onConfirm={() => { if (confirmState) confirmState.onConfirm(); setConfirmState(null); }}
      />
      <Toast message={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<DayFlow />);
</script>
</body>
</html>
